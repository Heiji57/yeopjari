org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# ── 옆자리 설정 ──
# Spring 서버 주소. 에뮬레이터에서 PC 의 localhost:8080 은 10.0.2.2:8080
yeopjari.apiBase=http://10.0.2.2:8080
# true: Pleos Vehicle SDK + NaviHelper 로 실제 차량 데이터 사용 / false: 시연 시나리오 재생
yeopjari.usePleosSdk=false
# Pleos SDK 저장소 주소와 의존성 (SDK 승인 후 채우기, 의존성은 쉼표로 구분)
yeopjari.pleosRepo=
yeopjari.pleosDeps=
